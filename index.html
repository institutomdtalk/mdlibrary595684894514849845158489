<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acervo — MD Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1D3A;
    --navy-deep:#050D1A;
    --navy-mid:#0F2645;
    --navy-light:#163158;
    --gold:#C4A45A;
    --gold-light:#D4BA7A;
    --gold-pale:#E8D9B0;
    --cream:rgba(255,255,255,.88);
    --muted:rgba(255,255,255,.42);
    --sidebar-w:340px;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

  body{
    font-family:'Raleway',sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    overflow:hidden;
  }

  .app{display:flex;height:100vh;width:100vw}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    position:relative;
    width:var(--sidebar-w);
    flex-shrink:0;
    background:
      radial-gradient(130% 70% at 0% 0%, rgba(196,164,90,.09), transparent 55%),
      linear-gradient(180deg,#03070E 0%,#050C18 50%,#08152B 100%);
    border-right:1px solid rgba(196,164,90,.22);
    box-shadow:18px 0 50px rgba(0,0,0,.6), inset -1px 0 0 rgba(196,164,90,.12);
    display:flex;flex-direction:column;height:100%;z-index:20;
    overflow:hidden;
  }
  .sidebar::before{
    content:'';position:absolute;left:-30%;top:-12%;
    width:160%;height:55%;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side, rgba(196,164,90,.18), transparent 70%);
    filter:blur(14px);
    animation:auroraDrift 16s ease-in-out infinite alternate;
  }
  .sidebar::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(rgba(196,164,90,.05) 1px, transparent 1px);
    background-size:22px 22px;opacity:.6;
    -webkit-mask-image:radial-gradient(140% 100% at 50% 0%, #000 25%, transparent 90%);
            mask-image:radial-gradient(140% 100% at 50% 0%, #000 25%, transparent 90%);
  }
  @keyframes auroraDrift{
    0%{transform:translate(0,0) scale(1);opacity:.5}
    50%{transform:translate(12%,18%) scale(1.18);opacity:.95}
    100%{transform:translate(-8%,30%) scale(1.06);opacity:.55}
  }
  .sidebar__head,.nav{position:relative;z-index:1}

  .sidebar__head{
    padding:38px 30px 24px;
    border-bottom:1px solid rgba(196,164,90,.14);
  }
  .sidebar__overline{
    font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:10px;
  }
  .sidebar__title{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;font-weight:500;line-height:1;letter-spacing:.02em;
    background:linear-gradient(100deg,#fff 0%,var(--gold-pale) 38%,#fff 58%,var(--gold-light) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:titleShine 7s linear infinite;
  }
  @keyframes titleShine{to{background-position:200% center}}
  .sidebar__count{
    margin-top:12px;font-size:11px;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;
  }

  .nav{overflow-y:auto;flex:1;padding:10px 0 30px}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:rgba(196,164,90,.25);border-radius:3px}

  /* ----- filtros por tema (substituídos pela home) ----- */
  .filters{display:none}

  /* ---------- PÁGINA INICIAL ---------- */
  .home{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;justify-content:center;
    padding:7vh 9vw;overflow-y:auto;background:var(--navy-deep);
    transition:opacity .6s ease,visibility .6s ease;
  }
  .home.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .home__bg{
    position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;transition:opacity 1.1s ease;will-change:opacity;
  }
  .home__bg.show{opacity:1;animation:homeZoom 18s ease-out forwards}
  @keyframes homeZoom{from{transform:scale(1.04)}to{transform:scale(1.15)}}
  /* tratamento de cor: harmoniza qualquer imagem com o navy/dourado */
  .home__overlay{
    position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(3,7,14,.95) 0%,rgba(5,12,24,.78) 42%,rgba(8,20,42,.38) 100%),
      linear-gradient(0deg,rgba(11,29,58,.4),rgba(5,13,26,.4));
  }
  .home__overlay::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(140% 100% at 0% 50%, transparent 42%, rgba(3,7,14,.6)),
      radial-gradient(80% 60% at 12% 28%, rgba(196,164,90,.10), transparent 60%);
  }
  .home__inner{
    position:relative;z-index:2;max-width:780px;
    padding-left:30px;
    border-left:1px solid;
    border-image:linear-gradient(180deg,transparent,rgba(196,164,90,.6),transparent) 1;
  }
  .home__overline{
    font-size:11px;letter-spacing:.36em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:16px;
    opacity:0;animation:homeIn .7s ease forwards .1s;
  }
  .home__title{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(44px,7vw,78px);line-height:.98;color:#fff;letter-spacing:.01em;
    opacity:0;animation:homeIn .9s cubic-bezier(.16,1,.3,1) forwards .15s;
  }
  .home__title em{
    font-style:italic;
    background:linear-gradient(100deg,var(--gold-light),var(--gold-pale),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .home__sub{
    margin:20px 0 14px;color:var(--cream);font-size:14.5px;line-height:1.7;max-width:430px;
    opacity:0;animation:homeIn .9s ease forwards .25s;
  }
  .home__divider{
    width:46px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);
    margin:0 0 26px;opacity:0;animation:homeIn .9s ease forwards .3s;
  }
  .home__themes{display:flex;flex-direction:column;gap:0;max-width:460px}
  .home__theme{
    display:flex;align-items:baseline;gap:18px;
    padding:11px 2px;cursor:pointer;
    border-bottom:1px solid rgba(196,164,90,.12);
    opacity:0;transform:translateY(12px);
    animation:homeIn .6s cubic-bezier(.16,1,.3,1) forwards;
  }
  .home__theme-name{
    font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:500;color:var(--cream);
    transition:color .3s,transform .35s cubic-bezier(.16,1,.3,1);white-space:nowrap;
  }
  .home__theme-line{
    flex:1;height:1px;align-self:center;
    background:linear-gradient(90deg,rgba(196,164,90,.22),transparent);
    transition:background .35s ease;
  }
  .home__theme-count{
    font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;
    letter-spacing:.18em;color:var(--gold);opacity:.55;transition:opacity .3s;
  }
  .home__theme:hover{border-color:rgba(196,164,90,.4)}
  .home__theme:hover .home__theme-name{
    color:#fff;transform:translateX(8px);text-shadow:0 0 22px rgba(196,164,90,.45);
  }
  .home__theme:hover .home__theme-line{background:linear-gradient(90deg,var(--gold),transparent)}
  .home__theme:hover .home__theme-count{opacity:1}
  @keyframes homeIn{to{opacity:1;transform:translateY(0)}}
  .sidebar__title{cursor:pointer}
  .chip{
    font-family:'Raleway',sans-serif;font-size:10px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    padding:6px 13px;border-radius:30px;
    color:var(--muted);background:rgba(255,255,255,.03);
    border:1px solid rgba(196,164,90,.22);
    transition:.25s cubic-bezier(.16,1,.3,1);white-space:nowrap;
  }
  .chip:hover{color:var(--gold-light);border-color:rgba(196,164,90,.5)}
  .chip.active{
    color:var(--navy-deep);background:var(--gold);
    border-color:var(--gold);
    box-shadow:0 4px 16px rgba(196,164,90,.28);
  }

  /* ----- section group ----- */
  .group__head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 30px 10px;cursor:pointer;
    user-select:none;
  }
  .group__label{
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--gold);font-weight:600;
  }
  .group__chev{
    width:8px;height:8px;border-right:1.5px solid var(--gold);
    border-bottom:1.5px solid var(--gold);transform:rotate(45deg);
    transition:transform .3s ease;opacity:.7;
  }
  .group.collapsed .group__chev{transform:rotate(-45deg)}
  .group__items{overflow:hidden;transition:max-height .35s ease}
  .group.collapsed .group__items{max-height:0 !important}

  .toc__item{
    position:relative;padding:13px 30px 13px 34px;cursor:pointer;
    border-left:2px solid transparent;
    opacity:0;transform:translateX(-12px);
    animation:tocIn .55s cubic-bezier(.16,1,.3,1) forwards;
    transition:background .35s ease,padding-left .35s ease;
  }
  .toc__item::before{
    content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:0 0 12px rgba(196,164,90,.7);
    transform:scaleY(0);transform-origin:top;
    transition:transform .4s cubic-bezier(.16,1,.3,1);
  }
  .toc__item:hover{background:rgba(196,164,90,.07);padding-left:40px}
  .toc__item:hover::before,.toc__item.active::before{transform:scaleY(1)}
  .toc__item.active{background:rgba(196,164,90,.12)}
  .toc__num{
    font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold);
    letter-spacing:.1em;display:inline-block;width:22px;
  }
  .toc__name{
    font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;
    line-height:1.25;color:var(--cream);
    transition:color .35s ease,text-shadow .35s ease;
  }
  .toc__item.active .toc__name,.toc__item:hover .toc__name{
    color:#fff;text-shadow:0 0 18px rgba(196,164,90,.4);
  }
  @keyframes tocIn{to{opacity:1;transform:translateX(0)}}
  .group__empty{
    padding:6px 30px 10px 34px;font-size:12px;font-style:italic;
    color:var(--muted);
  }

  /* ---------- READER ---------- */
  .reader{position:relative;flex:1;height:100%;overflow:hidden}
  .reader__bg{
    position:absolute;inset:0;background-size:cover;background-position:center;
    transition:opacity .6s ease,transform 8s ease,filter .5s ease;transform:scale(1.04);opacity:0;
  }
  .reader__bg.show{opacity:1}
  .reader:hover .reader__bg{filter:blur(4px)}
  .reader__overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(5,13,26,.55) 0%,rgba(5,13,26,.42) 45%,rgba(5,13,26,.72) 100%);
    transition:background .5s ease;pointer-events:none;
  }
  .reader:hover .reader__overlay{
    background:linear-gradient(180deg,rgba(5,13,26,.80) 0%,rgba(5,13,26,.70) 45%,rgba(5,13,26,.90) 100%);
  }
  .reader__scroll{position:relative;z-index:5;height:100%;overflow-y:auto;scroll-behavior:smooth}
  .reader__scroll::-webkit-scrollbar{width:8px}
  .reader__scroll::-webkit-scrollbar-thumb{background:rgba(196,164,90,.3);border-radius:4px}

  .article{max-width:880px;margin:0 auto;padding:9vh 7vw 16vh}
  .article__overline{
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-light);
    font-weight:600;margin-bottom:18px;opacity:0;animation:rise .8s ease forwards;
  }
  .article__title{
    font-family:'Cormorant Garamond',serif;font-size:clamp(38px,5.4vw,68px);font-weight:600;
    line-height:1.04;color:#fff;margin-bottom:14px;text-shadow:0 2px 30px rgba(0,0,0,.45);
    opacity:0;animation:rise .8s ease .1s forwards;
  }
  .article__divider{
    width:64px;height:2px;background:var(--gold);margin:26px 0 40px;
    opacity:0;animation:rise .8s ease .2s forwards;
  }
  .article__body{opacity:0;animation:rise 1s ease .3s forwards}
  .article__body p{
    font-size:clamp(16px,1.2vw,18px);line-height:1.9;color:#fff;margin-bottom:26px;
    font-weight:300;text-shadow:0 1px 18px rgba(0,0,0,.55);max-width:740px;
  }
  .article__body h2{
    font-family:'Cormorant Garamond',serif;font-size:clamp(26px,3vw,38px);font-weight:500;
    color:var(--gold-pale);margin:46px 0 18px;text-shadow:0 2px 24px rgba(0,0,0,.5);
  }
  .article__body em{color:var(--gold-pale);font-style:italic}
  .article__body strong{color:#fff;font-weight:600}

  .article__placeholder{
    margin:30px 0;padding:22px 24px;border:1px dashed rgba(196,164,90,.4);
    border-radius:14px;background:rgba(196,164,90,.06);
    font-size:14px;line-height:1.6;color:var(--gold-pale);font-style:italic;
    max-width:740px;
  }
  .article__source{
    margin-top:54px;padding-top:22px;border-top:1px solid rgba(196,164,90,.25);
    max-width:740px;
  }
  .article__source span{
    display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:7px;
  }
  .article__source p{
    font-size:13px !important;line-height:1.6 !important;color:rgba(255,255,255,.7) !important;
    margin:0 !important;font-weight:400 !important;font-style:italic;
  }

  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

  .empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px}
  .empty__title{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--gold-light)}

  /* ---------- TRANSLATOR ---------- */
  .tr-fab{
    position:fixed;bottom:26px;right:26px;z-index:50;
    width:60px;height:60px;border-radius:50%;cursor:pointer;border:none;
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);
    color:var(--navy-deep);font-family:'Raleway',sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.04em;
    box-shadow:0 8px 28px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .tr-fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 34px rgba(196,164,90,.4)}
  .tr-fab span{line-height:1;text-align:center}

  .tr-panel{
    position:fixed;bottom:100px;right:26px;z-index:50;
    width:380px;max-width:calc(100vw - 40px);
    background:rgba(8,18,36,.97);backdrop-filter:blur(14px);
    border:1px solid rgba(196,164,90,.3);border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    padding:22px;
    opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
  }
  .tr-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .tr-panel__head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  }
  .tr-panel__title{
    font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;
  }
  .tr-panel__title small{
    display:block;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);margin-top:2px;font-weight:600;
  }
  .tr-close{
    background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;
    line-height:1;transition:color .2s ease;
  }
  .tr-close:hover{color:#fff}
  .tr-input{
    width:100%;min-height:84px;resize:vertical;
    background:rgba(255,255,255,.05);border:1px solid rgba(196,164,90,.22);
    border-radius:12px;padding:12px 14px;color:#fff;font-family:'Raleway',sans-serif;
    font-size:15px;line-height:1.5;outline:none;transition:border-color .25s ease;
  }
  .tr-input:focus{border-color:var(--gold)}
  .tr-input::placeholder{color:var(--muted)}
  .tr-btn{
    width:100%;margin-top:12px;padding:12px;border:none;border-radius:30px;cursor:pointer;
    background:var(--gold);color:var(--navy-deep);font-family:'Raleway',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    transition:background .25s ease,transform .15s ease;
  }
  .tr-btn:hover{background:var(--gold-light)}
  .tr-btn:active{transform:scale(.98)}
  .tr-btn:disabled{opacity:.6;cursor:wait}
  .tr-result{
    margin-top:16px;padding:14px;border-radius:12px;
    background:rgba(196,164,90,.08);border:1px solid rgba(196,164,90,.18);
    min-height:54px;font-size:15px;line-height:1.6;color:#fff;
    display:none;
  }
  .tr-result.show{display:block}
  .tr-result.err{color:#f3b6b6;border-color:rgba(243,182,182,.3);background:rgba(243,182,182,.06)}
  .tr-result small{
    display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);margin-bottom:6px;font-weight:600;
  }

  /* ---------- MOBILE ---------- */
  .menu-btn{
    display:none;position:fixed;top:18px;left:18px;z-index:40;
    width:46px;height:46px;border:1px solid rgba(196,164,90,.4);
    background:rgba(5,13,26,.7);backdrop-filter:blur(8px);border-radius:50%;
    cursor:pointer;align-items:center;justify-content:center;
  }
  .menu-btn span{display:block;width:18px;height:1.5px;background:var(--gold-light);position:relative}
  .menu-btn span::before,.menu-btn span::after{
    content:'';position:absolute;left:0;width:18px;height:1.5px;background:var(--gold-light)}
  .menu-btn span::before{top:-6px}.menu-btn span::after{top:6px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}

  @media(max-width:860px){
    .menu-btn{display:flex}
    .sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.5)}
    .sidebar.open{transform:translateX(0)}
    .scrim.show{display:block}
    .article{padding:14vh 8vw 16vh}
    .nav-collapse{display:none}
  }

  /* ---------- RECOLHER MENU (desktop) ---------- */
  .sidebar{transition:transform .4s cubic-bezier(.16,1,.3,1),margin-left .4s cubic-bezier(.16,1,.3,1)}
  .nav-collapse{
    position:absolute;top:32px;right:20px;
    width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(196,164,90,.35);
    background:rgba(196,164,90,.08);color:var(--gold);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.25s;z-index:6;
  }
  .nav-collapse:hover{background:rgba(196,164,90,.2);border-color:var(--gold)}
  .nav-collapse svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none}
  .nav-show{
    position:fixed;top:24px;left:24px;z-index:30;
    width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(196,164,90,.4);
    background:linear-gradient(180deg,var(--navy-mid),var(--navy-deep));
    color:var(--gold);cursor:pointer;
    align-items:center;justify-content:center;display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transition:.25s;
  }
  .nav-show:hover{border-color:var(--gold);transform:translateY(-1px)}
  .nav-show svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none}
  @media(min-width:861px){
    body.nav-collapsed .sidebar{margin-left:calc(-1 * var(--sidebar-w))}
    body.nav-collapsed .nav-show{display:flex}
  }
  /* ---------- BOTÃO BAIXAR TEXTO ---------- */
  .article__actions{
    margin-top:54px;padding-top:30px;
    border-top:1px solid rgba(196,164,90,.16);
    display:flex;
  }
  .dl-btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 26px;border-radius:40px;cursor:pointer;
    font-family:'Raleway',sans-serif;font-size:12px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-light);background:rgba(196,164,90,.05);
    border:1px solid rgba(196,164,90,.45);
    transition:.3s cubic-bezier(.16,1,.3,1);
  }
  .dl-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
    transition:transform .3s ease}
  .dl-btn:hover{
    color:var(--navy-deep);background:var(--gold);
    border-color:var(--gold);
    box-shadow:0 12px 34px rgba(196,164,90,.3);
    transform:translateY(-2px);
  }
  .dl-btn:hover svg{transform:translateY(2px)}
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="Abrir menu"><span></span></button>
<button class="nav-show" id="navShow" aria-label="Mostrar menu" title="Mostrar menu">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
<div class="scrim" id="scrim"></div>

<div class="home" id="home">
  <div class="home__bg" id="homeBgA"></div>
  <div class="home__bg" id="homeBgB"></div>
  <div class="home__overlay"></div>

const navEl   = document.getElementById('nav');
const bgEl     = document.getElementById('bg');
const articleEl= document.getElementById('article');
const scrollEl = document.getElementById('scroll');
const countEl  = document.getElementById('count');
const sidebar  = document.getElementById('sidebar');
const scrim    = document.getElementById('scrim');

function roman(n){
  const map=[["X",10],["IX",9],["V",5],["IV",4],["I",1]];
  let r="";for(const[s,v]of map){while(n>=v){r+=s;n-=v;}}return r;
}

function buildNav(){
  navEl.innerHTML='';
  SECOES.forEach(sec=>{
    const itens = acervo.map((t,i)=>({t,i})).filter(x=>x.t.secao===sec.id);

    const group=document.createElement('div');
    group.className='group';

    const head=document.createElement('div');
    head.className='group__head';
    head.innerHTML=`<span class="group__label">${sec.label}</span><span class="group__chev"></span>`;

    const items=document.createElement('div');
    items.className='group__items';

    if(itens.length===0){
      items.innerHTML=`<div class="group__empty">Em breve…</div>`;
    } else {
      itens.forEach(({t,i},k)=>{
        const li=document.createElement('div');
        li.className='toc__item';
        li.dataset.index=i;
        li.dataset.tema=t.tema||'';
        li.style.animationDelay=(k*0.045)+'s';
        li.innerHTML=`<span class="toc__name">${t.titulo}</span>`;
        li.addEventListener('click',()=>openText(i));
        items.appendChild(li);
      });
    }

    head.addEventListener('click',()=>{
      group.classList.toggle('collapsed');
      items.style.maxHeight = group.classList.contains('collapsed') ? '0px' : items.scrollHeight+'px';
    });

    group.appendChild(head);
    group.appendChild(items);
    navEl.appendChild(group);
    // set initial open height
    requestAnimationFrame(()=>{ items.style.maxHeight = items.scrollHeight+'px'; });
  });

  countEl.textContent = acervo.length + (acervo.length===1?' texto':' textos');
  buildHome();
  if(filtroAtual!=='Todos') aplicarFiltro(filtroAtual);
}

let filtroAtual='Todos';

function buildFilters(){
  const cont=document.getElementById('filters');
  if(!cont) return;
  const temas=[];
  acervo.forEach(t=>{ const x=(t.tema||'').trim(); if(x && !temas.includes(x)) temas.push(x); });
  cont.innerHTML='';
  ['Todos',...temas].forEach(tema=>{
    const chip=document.createElement('div');
    chip.className='chip'+(tema===filtroAtual?' active':'');
    chip.textContent = tema==='Todos' ? 'Todos' : tema;
    chip.addEventListener('click',()=>aplicarFiltro(tema));
    cont.appendChild(chip);
  });
}

function aplicarFiltro(tema){
  filtroAtual=tema;
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', c.textContent===tema || (tema==='Todos'&&c.textContent==='Todos'));
  });
  document.querySelectorAll('.group').forEach(group=>{
    const items=group.querySelector('.group__items');
    let visiveis=0;
    items.querySelectorAll('.toc__item').forEach(it=>{
      const ok = tema==='Todos' || it.dataset.tema===tema;
      it.style.display = ok ? '' : 'none';
      if(ok) visiveis++;
    });
    group.style.display = visiveis===0 ? 'none' : '';
    if(!group.classList.contains('collapsed')){
      items.style.maxHeight = items.scrollHeight+'px';
    }
  });
}

const HOME_IMAGES = [IMG1,IMG2,IMG3,IMG4];
let lastImgIdx=-1;
function randomImg(){
  let i;
  do{ i=Math.floor(Math.random()*HOME_IMAGES.length); } while(i===lastImgIdx && HOME_IMAGES.length>1);
  lastImgIdx=i;
  return HOME_IMAGES[i];
}
const CATEGORIAS = ["Health & Medicine","History","Places to Visit","Psychology & Mindset","Science & Nature","Business","Trending Topics","Society","People","Geek World"];
let homeBgToggle=false;
let homeReady=false;
let homeRotador=null;
function setHomeBg(url){
  const a=document.getElementById('homeBgA'), b=document.getElementById('homeBgB');
  if(!a||!b) return;
  url = url || HOME_IMAGES[0];
  const show = homeBgToggle ? a : b;
  const hide = homeBgToggle ? b : a;
  show.style.backgroundImage=`url('${url}')`;
  show.classList.add('show'); hide.classList.remove('show');
  homeBgToggle=!homeBgToggle;
}

function buildHome(){
  const wrap=document.getElementById('homeThemes');
  if(!wrap) return;

  const counts={};
  acervo.forEach(t=>{ const x=(t.tema||'').trim(); if(x) counts[x]=(counts[x]||0)+1; });

  const ordered=CATEGORIAS.slice();
  Object.keys(counts).forEach(k=>{ if(!ordered.includes(k)) ordered.push(k); });

  const opts=[{nome:'Todos os textos',tema:'Todos',n:acervo.length}];
  ordered.forEach(tm=>{ if(counts[tm]) opts.push({nome:tm,tema:tm,n:counts[tm]}); });

  wrap.innerHTML='';
  homeReady=false;
  opts.forEach((o,idx)=>{
    const row=document.createElement('div');
    row.className='home__theme';
    row.style.animationDelay=(0.3+idx*0.06)+'s';
    row.innerHTML=`<span class="home__theme-name">${o.nome}</span><span class="home__theme-line"></span><span class="home__theme-count">${o.n}</span>`;
    row.addEventListener('mouseenter',()=>setHomeBg(randomImg()));
    row.addEventListener('click',()=>{ if(!homeReady) return; enterReader(o.tema); });
    wrap.appendChild(row);
  });
  setHomeBg(randomImg());
  if(homeRotador) clearInterval(homeRotador);
  homeRotador=setInterval(()=>{
    const home=document.getElementById('home');
    if(home && !home.classList.contains('hidden')) setHomeBg(randomImg());
  }, 8000);
  setTimeout(()=>{ homeReady=true; }, 700);
}

function enterReader(tema){
  aplicarFiltro(tema);
  const idx = acervo.findIndex(t=> tema==='Todos' || (t.tema||'').trim()===tema);
  if(idx>=0) openText(idx);
  const home=document.getElementById('home');
  if(home) home.classList.add('hidden');
}

function showHome(){
  const home=document.getElementById('home');
  if(home) home.classList.remove('hidden');
  closeMenu();
}

let currentIndex=0;
function openText(i){
  const t=acervo[i];
  if(!t) return;
  currentIndex=i;

  bgEl.classList.remove('show');
  setTimeout(()=>{
    bgEl.style.backgroundImage=`url('${t.imagem}')`;
    bgEl.classList.add('show');
  },120);

  articleEl.innerHTML=`
    ${t.overline?`<div class="article__overline">${t.overline}</div>`:''}
    <h2 class="article__title">${t.titulo}</h2>
    <div class="article__divider"></div>
    <div class="article__body">${t.conteudo}
      ${t.fonte?`<div class="article__source"><span>Fonte</span><p>${t.fonte}</p></div>`:''}
    </div>
    <div class="article__actions">
      <button class="dl-btn" onclick="downloadCurrent()">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M5 21h14"/></svg>
        Baixar este texto
      </button>
    </div>
  `;
  articleEl.querySelectorAll('[class^="article__"]').forEach(el=>{
    el.style.animation='none';el.offsetHeight;el.style.animation='';
  });
  scrollEl.scrollTop=0;

  document.querySelectorAll('.toc__item').forEach(it=>{
    it.classList.toggle('active', +it.dataset.index===i);
  });
  closeMenu();
}

function downloadCurrent(){
  const t=acervo[currentIndex];
  if(!t) return;
  const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${t.titulo}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F0EDE8;color:#0B1D3A;font-family:'Raleway',sans-serif;line-height:1.9;padding:7vh 6vw}

.rule{width:60px;height:2px;background:#C4A45A;margin:24px 0 34px}
.body{font-size:17px;color:#26303f}

/* ---------- TRANSLATOR ---------- */
const trFab=document.getElementById('trFab');
const trPanel=document.getElementById('trPanel');
const trClose=document.getElementById('trClose');
const trInput=document.getElementById('trInput');
const trBtn=document.getElementById('trBtn');
const trResult=document.getElementById('trResult');

function openTr(){trPanel.classList.add('open');trInput.focus();}
function closeTr(){trPanel.classList.remove('open');}
trFab.addEventListener('click',()=>trPanel.classList.contains('open')?closeTr():openTr());
trClose.addEventListener('click',closeTr);

async function translate(text){
  // 1ª tentativa: Google (gtx)
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(text)}`;
    const r=await fetch(url);
    if(r.ok){
      const data=await r.json();
      return data[0].map(seg=>seg[0]).join('');
    }
  }catch(e){/* tenta o próximo */}

  // 2ª tentativa: MyMemory (fallback)
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|pt-BR`;
    const r=await fetch(url);
    const data=await r.json();
    if(data.responseData&&data.responseData.translatedText){
      return data.responseData.translatedText;
    }
  }catch(e){/* falhou */}

  throw new Error('fail');
}

async function runTranslate(){
  const text=trInput.value.trim();
  if(!text){trInput.focus();return;}
  trBtn.disabled=true;trBtn.textContent='Traduzindo…';
  trResult.className='tr-result show';
  trResult.innerHTML='<small>Português (BR)</small>…';
  try{
    const out=await translate(text);
    trResult.className='tr-result show';
    trResult.innerHTML=`<small>Português (BR)</small>${out}`;
  }catch(e){
    trResult.className='tr-result show err';
    trResult.innerHTML='<small>Erro</small>Não foi possível traduzir agora. Verifique a conexão — o tradutor funciona normalmente quando a página está publicada (GitHub Pages).';
  }finally{
    trBtn.disabled=false;trBtn.textContent='Traduzir';
  }
}
trBtn.addEventListener('click',runTranslate);
trInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) runTranslate();
});

// traduzir automaticamente ao selecionar um trecho da leitura
scrollEl.addEventListener('mouseup',()=>{
  const sel=window.getSelection().toString().trim();
  if(sel.length>1){
    trInput.value=sel;
    openTr();
    runTranslate();
  }
});

/* ---------- PLANILHA (Google Sheets) ---------- */
/* Cole abaixo, entre as aspas, a URL do app da sua planilha (termina em /exec). */
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwbuZ3dWkBTH6_0iqR40LX7l6NjOvq2CWCa4Qh6rxohzoGQ5Hn90WdtmA5GkIxfWeDT8w/exec";

/* Converte texto simples (com quebras de linha) em parágrafos. */
function textToHtml(t){
  if(!t) return '';
  if(/<p|<h2|<div/i.test(t)) return t;            /* já é HTML: usa como está */
  return t.split(/\n+/).map(l=>l.trim()).filter(Boolean)
    .map(l=> l.startsWith('## ') ? '<h2>'+l.slice(3)+'</h2>' : '<p>'+l+'</p>')
    .join('');
}

async function carregarDaPlanilha(){
  if(!SHEETS_URL) return;                          /* sem URL: mantém os textos embutidos */
  try{
    const r = await fetch(SHEETS_URL);
    const dados = await r.json();
    if(Array.isArray(dados) && dados.length){
      acervo = dados.map(d=>({
        secao:(d.secao||'regular').toString().trim().toLowerCase(),
        tema:(d.tema||'').toString().trim(),
        titulo:d.titulo||'',
        overline:d.overline||'',
        imagem:d.imagem||'',
        conteudo:textToHtml(d.conteudo||''),
        fonte:d.fonte||''
      }));
      buildNav();
    }
  }catch(e){ /* falhou: mantém o acervo de reserva */ }
}

/* ---------- INIT ---------- */
buildNav();
if(!acervo.length){ articleEl.innerHTML='<div class="empty"><div class="empty__title">Acervo vazio</div></div>'; }
carregarDaPlanilha();
</script>
